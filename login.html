<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">
<div class="logo">
🔐 Admin Login
</div>
</header>

<div style="max-width:400px;margin:auto;padding:20px;">

<input
id="email"
type="email"
placeholder="Admin Email">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<a href="index.html">
⬅ Back Home
</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdUsGHwAeVF-d8NQs40hEoGHhJmYirm-M",
  authDomain: "jahid-mobile-shop.firebaseapp.com",
  projectId: "jahid-mobile-shop",
  storageBucket: "jahid-mobile-shop.firebasestorage.app",
  messagingSenderId: "501758307554",
  appId: "1:501758307554:web:4ff36dad0e3508478782bb"
};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

window.login=async function(){

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

if(email==""||password==""){

alert("সব তথ্য দিন");

return;

}

try{

await signInWithEmailAndPassword(

auth,

email,

password

);

localStorage.setItem("admin","true");

alert("Login Successful");

window.location.href="admin.html";

}catch(e){

alert(e.message);

}

}

</script>

</body>
</html>
