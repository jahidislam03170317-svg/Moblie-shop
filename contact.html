<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#0a8f3d;
color:white;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:500px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0a8f3d;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.info{
margin-top:20px;
line-height:1.8;
}
</style>
</head>

<body>

<header>📞 Contact Us</header>

<div class="container">

<input type="text" placeholder="আপনার নাম">

<input type="email" placeholder="আপনার ইমেইল">

<textarea placeholder="আপনার বার্তা"></textarea>

<button onclick="alert('আপনার বার্তা পাঠানো হয়েছে!')">Send Message</button>

<div class="info">
<b>📱 ফোন:</b> 01XXXXXXXXX<br>
<b>📧 Email:</b> your@email.com<br>
<b>📍 ঠিকানা:</b> Chattogram, Bangladesh
</div>

</div>

</body>
</html>
